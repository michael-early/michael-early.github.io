[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eagles-ml-predictor"
version = "0.1.0"
description = "Research-backed machine learning project for predicting the 2026 Philadelphia Eagles season."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "streamlit>=1.35",
]

[project.optional-dependencies]
nflverse = [
    "nfl-data-py>=0.3.3; python_version < '3.14'",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
eagles-ml = "eagles_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
